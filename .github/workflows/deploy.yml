name: Deploy to cPanel

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Dependencies and Build
        run: |
          npm ci
          npm run build

      - name: Package Production Files
        env:
          PORT: 5000
          NODE_ENV: production
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          rm -rf release deploy.zip
          mkdir release

          # Copy React build assets
          cp -r frontend/dist release/dist

          # Copy Backend files
          cp -r backend/api release/api
          cp backend/server.js release/server.js
          cp backend/app.js release/app.js
          cp backend/package.json release/package.json

          # Inject production environment variables for Supabase and Resend
          cat <<EOF > release/.env
          PORT=${PORT}
          NODE_ENV=${NODE_ENV}
          SUPABASE_URL=${SUPABASE_URL}
          SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
          RESEND_API_KEY=${RESEND_API_KEY}
          EOF

          # Create zip bundle
          cd release
          zip -r ../deploy.zip .

      - name: Upload to cPanel
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.PORT }}
          source: "deploy.zip"
          target: "/home/tarpainf/studiomeroclick.com.np/"

      - name: Extract, Create .htaccess and Restart Server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.PORT }}
          script: |
            cd /home/tarpainf/studiomeroclick.com.np/

            # Unzip production bundle
            unzip -o deploy.zip
            rm -f deploy.zip

            # Remove static React .htaccess if Vite placed one inside dist/
            rm -f dist/.htaccess

            # FORCE WRITE clean, correct CloudLinux Passenger .htaccess
            echo '# DO NOT REMOVE. CLOUDLINUX PASSENGER CONFIGURATION BEGIN' > .htaccess
            echo 'PassengerAppRoot "/home/tarpainf/studiomeroclick.com.np"' >> .htaccess
            echo 'PassengerBaseURI "/"' >> .htaccess
            echo 'PassengerNodejs "/home/tarpainf/nodevenv/studiomeroclick.com.np/20/bin/node"' >> .htaccess
            echo 'PassengerAppType node' >> .htaccess
            echo 'PassengerStartupFile app.js' >> .htaccess
            echo '# DO NOT REMOVE. CLOUDLINUX PASSENGER CONFIGURATION END' >> .htaccess

            # LiteSpeed Direct Proxy Handler (FIXED REWRITE RULES)
            echo '<IfModule mod_rewrite.c>' >> .htaccess
            echo '  RewriteEngine On' >> .htaccess
            echo '  RewriteCond %{REQUEST_FILENAME} -f [OR]' >> .htaccess
            echo '  RewriteCond %{REQUEST_FILENAME} -d' >> .htaccess
            echo '  RewriteRule ^ - [L]' >> .htaccess
            echo '  RewriteRule ^(.*)$ app.js/$1 [QSA,L]' >> .htaccess
            echo '</IfModule>' >> .htaccess

            # Install production dependencies
            npm install --production

            # Force Passenger/LiteSpeed restart
            mkdir -p tmp
            touch tmp/restart.txt