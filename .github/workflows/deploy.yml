name: Deploy to cPanel

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Dependencies and Build
        run: |
          npm ci
          npm run build

      - name: Package Production Files
        run: |
          rm -rf release deploy.zip
          mkdir release

          # Copy React build
          cp -r dist release/

          # Copy Backend files
          [ -d api ] && cp -r api release/ || true
          [ -f server.js ] && cp server.js release/ || true
          [ -f app.js ] && cp app.js release/ || true

          # Copy Package Files
          cp package.json release/
          [ -f package-lock.json ] && cp package-lock.json release/ || true

          cd release
          zip -r ../deploy.zip .

      - name: Upload to cPanel
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.PORT }}
          source: "deploy.zip"
          target: "/home/tarpainf/studiomeroclick.com.np/"

      - name: Extract and Restart Server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.PORT }}
          script: |
            cd /home/tarpainf/studiomeroclick.com.np/

            # Unzip production bundle
            unzip -o deploy.zip
            rm -f deploy.zip

            # If .htaccess exists inside dist/, move it out to the application root
            if [ -f dist/.htaccess ]; then
              mv dist/.htaccess ./.htaccess
            fi

            # Install production dependencies
            npm install --omit=dev

            # Trigger Phusion Passenger / LiteSpeed app restart
            mkdir -p tmp
            touch tmp/restart.txt