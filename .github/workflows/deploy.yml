name: Deploy to cPanel

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy through SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.PORT }}
          script: |
            # Set Node.js binary path (Update 'alt-nodejs18' to your server's Node version if needed)
            export PATH=/opt/alt/alt-nodejs18/root/usr/bin:$PATH

            cd /home/tarpainf/studiomeroclick.com.np

            git pull origin main

            npm install
            npm run build

            # Restart the cPanel Node.js application (Phusion Passenger)
            mkdir -p tmp
            touch tmp/restart.txt