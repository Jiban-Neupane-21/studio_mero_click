name: Deploy to cPanel

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Install Dependencies and Build
        run: |
          npm install
          npm run build

      - name: Package Production Files
        run: |
          mkdir release
          # Copy only the files needed for production
          cp -r dist release/
          cp -r api release/
          cp server.js release/
          cp app.js release/
          cp package.json release/
          cp package-lock.json release/
          
          # Create a zip archive
          cd release
          zip -r ../deploy.zip .

      - name: Upload to cPanel
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.PORT }}
          source: "deploy.zip"
          target: "/home/tarpainf/studiomeroclick.com.np/"

      - name: Extract and Restart Server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.PORT }}
          script: |
            export PATH=/opt/alt/alt-nodejs18/root/usr/bin:$PATH
            
            cd /home/tarpainf/studiomeroclick.com.np/
            
            # Unzip the production bundle (overwrite existing files)
            unzip -o deploy.zip
            
            # Clean up the zip file
            rm deploy.zip
            
            # Remove any rogue development index.html file to prevent Apache from serving it
            rm -f index.html
            
            # Install production dependencies
            npm install --omit=dev
            
            # Force restart Passenger Node.js server
            mkdir -p tmp
            touch tmp/restart.txt