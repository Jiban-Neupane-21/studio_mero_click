name: Deploy to cPanel

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Build project
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npm run build

      - name: Package application
        env:
          NODE_ENV: production
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          BOOKING_NOTIFICATION_EMAIL: ${{ secrets.BOOKING_NOTIFICATION_EMAIL }}
          RESEND_FROM_EMAIL: ${{ secrets.RESEND_FROM_EMAIL }}
        run: |
          rm -rf release deploy.zip
          mkdir -p release

          # Frontend
          cp -r frontend/dist release/dist

          # Backend
          cp -r backend/api release/api
          cp backend/server.js release/server.js
          cp backend/app.js release/app.js
          cp backend/package.json release/package.json

          # Create .env file
          cat > release/.env << EOF
          NODE_ENV=${NODE_ENV}
          RESEND_API_KEY=${RESEND_API_KEY}
          BOOKING_NOTIFICATION_EMAIL=${BOOKING_NOTIFICATION_EMAIL}
          RESEND_FROM_EMAIL=${RESEND_FROM_EMAIL}
          EOF

          cd release
          zip -r ../deploy.zip .

      - name: Upload to cPanel
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.PORT }}
          source: "deploy.zip"
          target: "/home/tarpainf/studiomeroclick.com.np"

      - name: Deploy application
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.PORT }}
          script: |
            cd /home/tarpainf/studiomeroclick.com.np

            unzip -o deploy.zip
            rm -f deploy.zip

            /home/tarpainf/nodevenv/studiomeroclick.com.np/20/bin/npm install --omit=dev