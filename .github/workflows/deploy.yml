name: Deploy to cPanel

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build application
        run: npm run build

      - name: Deploy through SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.PORT }}
          script: |
            export PATH=/opt/alt/alt-nodejs18/root/usr/bin:$PATH

            cd /home/tarpainf/repositories/studio_mero_click

            git pull origin main

            /opt/alt/alt-nodejs18/root/usr/bin/npm install
            /opt/alt/alt-nodejs18/root/usr/bin/npm run build

            # Restart the cPanel Node.js application (Passenger)
            mkdir -p tmp
            touch tmp/restart.txt
